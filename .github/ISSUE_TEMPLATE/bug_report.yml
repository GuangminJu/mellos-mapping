name: Bug report
description: Something the map, the server or the pane gets wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Three fields below — host, version, terminal — are what most
        diagnoses turn on. Anything exploitable belongs in a private
        [security advisory](https://github.com/GuangminJu/mellos-mapping/security/advisories/new)
        instead of here.

  - type: dropdown
    id: host
    attributes:
      label: Host
      description: What is driving the MCP server?
      options:
        - Claude Code (plugin)
        - Codex CLI
        - Another MCP client
        - No host — the mmap pane / watcher on its own
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: mellos-mapping version
      description: >-
        The version your client lists for the plugin, or `npm ls -g
        mellos-mapping` for an npm install.
      placeholder: "0.20.3"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: OS and terminal
      description: >-
        The terminal matters as much as the OS — the pane is drawn with ANSI
        and split through Windows Terminal where that exists.
      placeholder: "Windows 11 / Windows Terminal 1.21 — or macOS 15 / iTerm2 3.5"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: >-
        The tool call or keystroke that triggers it. If a map file is involved,
        paste the relevant part of `.mellos/map.json` or
        `.mellos/pages/<slug>.json` — the smallest version that still fails.
      render: text
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: >-
        Error text, a screenshot of the pane, whether it survives a restart.
    validations:
      required: false
