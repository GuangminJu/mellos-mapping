name: Feature request
description: Something the map should be able to say and cannot
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The map is a ledger of a layered design: bands rank primitives at the
        bottom, edges point strictly downward, and a node is planned, in
        progress, done-with-evidence or regressed. Proposals that fit that
        grain land easily; ones that need cycles or hidden state usually
        need rethinking first.

  - type: textarea
    id: problem
    attributes:
      label: What can't you express today?
      description: >-
        Describe the design or the moment in the work, not the feature. What
        did you want the pane to show that it could not?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would it look like?
      description: >-
        A tool field, a key in the pane, a rendering — whatever form you have
        in mind. Rough is fine.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: What did you do instead?
      description: The workaround, if there was one.
    validations:
      required: false
