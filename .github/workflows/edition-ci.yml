name: Verify installable edition
on:
  push:
    branches: [claude, chatgpt-app]
  pull_request:
    branches: [claude, chatgpt-app]
  workflow_dispatch:
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/verify-release.mjs
      - run: node install.mjs --help
