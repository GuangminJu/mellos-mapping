# Publish the npm package from a version tag, authenticating via npm Trusted
# Publishing: npmjs.com trusts this repository's `publish-npm.yml`, so the run
# exchanges its GitHub Actions OIDC identity for a publish grant — no token, no
# one-time password, no secret — and `--provenance` attaches the sigstore
# attestation a laptop publish cannot.
#
# The workflow definition is read from the ref it is dispatched on, so it is
# always dispatched on `main` and told which tag to publish; the tag is what
# gets checked out, verified and published. Run once the tag exists:
#   gh workflow run publish-npm.yml --ref main -f tag=v0.28.0
#
# `npm run verify` runs on the npm that ships with the runner's Node — the one
# the CI matrix proves it against. Only the publish itself needs npm 11.5.1+,
# so the upgrade comes after verify.
name: publish-npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish, e.g. v0.28.0'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Linux tmux integration dependencies
        run: |
          if ! command -v tmux >/dev/null || ! command -v script >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y tmux bsdutils
          fi
      - run: npm run verify
      - name: tag names the checked-out version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not name package.json version $version"
            exit 1
          fi
      - run: npm install -g npm@latest
      - run: npm publish --provenance
