# Typecheck + tests + build on the three OSes users actually run, plus a
# guard that the committed dist/ really is the build of the committed src/
# (plugin installs clone the repo and run nothing, so dist drift would ship).
#
# `npm run verify` includes `check:package`, which packs the tarball through
# the real prepack lifecycle and fails if any `exports`/`bin` target is
# missing from it — the npm half of the same "what ships is what was built"
# guarantee the dist diff gives the plugin half.
# It also checks the Codex distribution over stdio in isolated projects.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Linux tmux integration dependencies
        if: runner.os == 'Linux'
        run: |
          if ! command -v tmux >/dev/null || ! command -v script >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y tmux bsdutils
          fi
      - run: npm run verify
      - name: committed dist matches src
        if: runner.os == 'Linux'
        run: git diff --exit-code -- dist

  lock-runtime:
    name: lock runtime (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18.17.0', '20.3.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Build tools use the development runtime. The shipped code and native
      # addons are then exercised under each supported runtime floor/current.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/check-store-lock.mjs
