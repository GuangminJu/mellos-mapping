# Typecheck + tests + build on the three OSes users actually run, plus a
# guard that the committed dist/ really is the build of the committed src/
# (plugin installs clone the repo and run nothing, so dist drift would ship).
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: committed dist matches src
        if: runner.os == 'Linux'
        run: git diff --exit-code -- dist
